<!doctype html><html lang=en><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>drover board mockup (#1354)</title>
<!-- #1354 design mockup: the Board tab of the one terminal app (#1352's frame) as character grids, each screen at
     40x18 (a phone terminal, keyboard up) and 120x40. Colours are the default scheme's tokens (swag's
     schemes/github-dark.json), as in ../drover-chat; screens.js draws every grid from the phone's screen JSON in
     fixtures.js. A 40-column grid is 390 px wide, a 120-column grid 1440 px wide. -->
<style>
:root{--bg:#0d1117;--card:#161b22;--edge:#30363d;--line:#21262d;--fg:#c9d1d9;--mute:#8b949e;--l:#58a6ff;--link:#58a6ff;--g:#3fb950;--a:#d29922;--r:#f85149;--p:#bc8cff;--c:#39c5cf}
body{margin:0;padding:16px;background:#010409;color:var(--fg);font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
h2{font-size:13px;font-weight:400;color:var(--mute);margin:24px 0 8px}
.term{--cw:calc(var(--px) / var(--cols));display:inline-block;width:var(--px);background:var(--bg);font-family:Menlo,ui-monospace,monospace;font-size:calc(var(--cw) / .602);line-height:calc(var(--cw) * 2.05);white-space:pre}
.term[style*="--cols: 40"]{--px:390px}
.term[style*="--cols: 120"]{--px:1440px}
.term>div{display:flex;height:calc(var(--cw) * 2.05)}
.term i{display:inline-block;flex:none;width:var(--cw);text-align:center;font-style:normal;overflow:visible}
.m{color:var(--mute)}.l{color:var(--l)}.a{color:var(--a)}.r{color:var(--r)}.g{color:var(--g)}.p{color:var(--p)}.c{color:var(--c)}
.link{color:var(--link);text-decoration:underline}.edge{color:var(--edge)}
.b{font-weight:700}.u{text-decoration:underline}
.bg-card{background:var(--card)}
.inv{background:var(--l);color:var(--bg)}
</style></head>
<body>
<div id=out></div>
<script src=fixtures.js></script>
<script src=screens.js></script>
<script>
const only = new URLSearchParams(location.search).get('only');
const out = document.getElementById('out');
for (const s of BOARD.SCREENS) for (const [c, r] of [[40, 18], [120, 40]]) {
  const key = `${s.name}-${c}x${r}`;
  if (only && only !== key) continue;
  if (!only) { const h = document.createElement('h2'); h.textContent = `${key} · ${s.title}`; out.append(h); }
  try { BOARD.render(c, r, s, out); } catch (e) { (window.problems ||= []).push(`${key}: ${e}`); const p = document.createElement('p'); p.className = 'r'; p.textContent = String(e); out.append(p); }
}
</script>
</body></html>
