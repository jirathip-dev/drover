<!doctype html><html lang=en><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Kitchen sprite sheet</title>
<!-- #239 sprite sheet: every chef action × 3 looks (frame 1), frame 2 of the loop, the 5 project trims, the rail
     ticket and its needs-you variant, and the 16 px row sprites. Drawn from art.mjs; shot as sprite-sheet.png. -->
<link rel=stylesheet href=../../../assets/serve.css>
<link rel=stylesheet href=theme.css>
<style>
body{padding:var(--s3)}
h1{font-size:var(--fs);margin:var(--s2) 0}
.sheet{display:grid;grid-template-columns:14ch repeat(4,156px) minmax(0,1fr);gap:var(--s2) var(--s2);align-items:center}
.sheet>b{font-weight:400;color:var(--mute);font-size:var(--fs-meta)}
.cell{width:156px;height:118px;display:flex;flex-direction:column;align-items:center;justify-content:end;background:linear-gradient(#0000 0 70%,#00000022 70%),repeating-conic-gradient(#4a3f38 0 25%,#41372f 0 50%) 0 0/24px 24px;border-radius:6px}
.cell svg{width:132px;height:100px;display:block}
.cell.f2v{--o1:0;--o2:1}
.lb{font-size:var(--fs-meta);color:var(--mute);text-align:center}
.note{font-size:var(--fs-meta);color:var(--mute);margin:0}
.rows{display:flex;flex-wrap:wrap;gap:var(--s3) var(--s4);align-items:end;margin:var(--s2) 0}
.rows figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:var(--s1);font-size:var(--fs-meta);color:var(--mute)}
.rows .big{width:48px;height:48px;image-rendering:pixelated;background:#161b22;border-radius:4px}
.trims{display:flex;flex-wrap:wrap;gap:var(--s2)}
</style></head>
<body class=heat-busy>
<svg width=0 height=0 style="position:absolute"><defs id=defs></defs></svg>
<h1>kitchen · sprite sheet <span class=m>(#239 · art.mjs · 132 × 100 like the farm's horses, 1 pixel = 4)</span></h1>
<div class=sheet id=grid></div>
<h1>project trim <span class=m>(--fk = the fleet's #162 colour: blue, purple, cyan, green, amber)</span></h1>
<div class=trims id=trims></div>
<h1>16 px row sprites <span class=m>(#241 row_sprites: Queue and Events rows; 1× and 3×)</span></h1>
<div class=rows id=rows></div>
<script type=module>
import { symbols, style, ACTIONS } from './art.mjs';
document.getElementById('defs').innerHTML = symbols();
const W = { cook: 'impl · cook', chop: 'fix · chop', taste: 'rev · taste', carry: 'update · carry', wait: 'idle · wait', serve: 'done · serve', bell: 'blocked · bell', fan: 'held · fan' };
const sp = (id, st, cls = '') => `<div class="cell ${cls}"><svg viewBox="0 0 132 100" style="${st}"><use href="#k-${id}"/></svg></div>`;
let h = '<b></b><span class=lb>look A · toque</span><span class=lb>look B · bandana</span><span class=lb>look C · cap</span><span class=lb>A · frame 2</span><span></span>';
for (const k of Object.keys(ACTIONS)) h += `<b>${W[k]}</b>${sp(k, style(0, 'l'))}${sp(k, style(1, 'p'))}${sp(k, style(2, 'g'))}${sp(k, style(0, 'l'), 'f2v')}<span></span>`;
h += `<b>rail · ticket</b>${sp('ticket', '')}<div class=cell><svg class=needs-t viewBox="0 0 132 100"><use href="#k-ticket"/></svg></div><span class=lb style="grid-column:span 2;text-align:left">queued issue · needs you (red, flutters)</span><span></span>`;
document.getElementById("grid").innerHTML = h;
document.getElementById('trims').innerHTML = ['l', 'p', 'c', 'g', 'a'].map(k => sp('wait', style(3, k))).join('');
const R = { cook: 'cook', chop: 'chop', taste: 'taste', carry: 'carry', wait: 'wait', serve: 'serve', bell: 'bell', ticket: 'queued', back: 'sent back' };
document.getElementById('rows').innerHTML = Object.entries(R).map(([k, w]) => `<figure><svg class=rs16 viewBox="0 0 16 16" style="${style(0, 'l')}"><use href="#r-${k}"/></svg><svg class=big viewBox="0 0 16 16" style="${style(0, 'l')}"><use href="#r-${k}"/></svg>${w}</figure>`).join('') +
  `<figure><svg class=rs16 viewBox="0 0 16 16" style="${style(1, 'p')}"><use href="#r-chop"/></svg><svg class=big viewBox="0 0 16 16" style="${style(1, 'p')}"><use href="#r-chop"/></svg>look B</figure>` +
  `<figure><svg class=rs16 viewBox="0 0 16 16" style="${style(2, 'g')}"><use href="#r-taste"/></svg><svg class=big viewBox="0 0 16 16" style="${style(2, 'g')}"><use href="#r-taste"/></svg>look C</figure>` +
  `<figure><svg class="big needs-t" viewBox="0 0 16 16"><use href="#r-ticket"/></svg>needs you</figure>`;
</script>
</body></html>
