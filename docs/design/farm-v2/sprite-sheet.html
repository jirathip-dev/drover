<!doctype html>
<html lang=en>
<!-- #242: every sprite in sprites.svg, as herd.js would use it (legs turned by --a, manes by --mane). -->
<meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>Farm v2 sprites</title>
<style>
body{margin:0;padding:12px;background:#0f1a13;color:#ece4cc;font:11px/1.4 ui-monospace,Menlo,monospace}
h2{font-size:13px;margin:12px 0 6px;color:#e2bf5e}
.w{display:flex;flex-wrap:wrap;gap:8px}
figure{margin:0;padding:4px;background:#9fb07a;border-radius:6px;text-align:center;color:#3a332e}
figure.d{background:#1d1a12;color:#a3a68a;border:1px solid #3b3a27}
svg{display:block;overflow:visible;margin:0 auto}
.b svg{width:132px;height:100px}.rl svg{width:80px;height:56px;margin:22px auto}
.r svg{image-rendering:pixelated}
</style>
<h2>actions (132 × 100) · coats: palomino, bay, grey · project colour: green, cyan, blue</h2><div class=w id=a></div>
<h2>moments (132 × 100)</h2><div class=w id=m></div>
<h2>rail (40 × 28) and paddock bay (52 × 30)</h2><div class=w id=rl></div>
<h2>row sprites (16 × 16: actual size, ×4) and Host minis (40 × 16)</h2><div class=w id=r></div>
<script>
const NS = 'http://www.w3.org/2000/svg';
const C = ['--c:#c89a56;--d:#a37a3c;--m:#e8dcc0;--b:#efe7dc;--fk:#7fd06a', '--c:#8a5a33;--d:#6f4527;--m:#2e2019;--b:transparent;--fk:#5fd0c4', '--c:#b9bcc6;--d:#989ca9;--m:#7d8089;--b:transparent;--fk:#7cc4f0'];
const use = (id, box, st = '', css = '') => `<svg viewBox="${box}" style="${st};${css}"><use href="#${id}"/></svg>`;
fetch('sprites.svg').then(r => r.text()).then(t => {
  const d = document.createElementNS(NS, 'svg');
  d.style.cssText = 'position:absolute;width:0;height:0';
  d.innerHTML = '<defs>' + t + '</defs>';
  document.body.prepend(d);
  d.querySelectorAll('.leg').forEach(l => l.setAttribute('style', `transform-box:fill-box;transform-origin:50% 0;transform:rotate(${l.style.getPropertyValue('--a') || '0deg'})`));
  const gs = c => [...d.querySelectorAll('g.' + c)];
  a.innerHTML = gs('horse').map(g => C.map(c => `<figure class=b>${use(g.id, '0 0 132 100', c)}${g.id}</figure>`).join('')).join('');
  m.innerHTML = gs('moment').map(g => `<figure class=b>${use(g.id, '0 0 132 100', C[1])}${g.id}</figure>`).join('');
  rl.innerHTML = gs('rail').map(g => `<figure class=rl>${use(g.id, g.id === 'paddock-bay' ? '0 0 52 30' : '0 0 40 28', '--fk:#7fd06a')}${g.id}</figure>`).join('');
  r.innerHTML = gs('row').map(g => `<figure class="r d">${use(g.id, '0 0 16 16', '--fk:#7fd06a', 'width:16px;height:16px;margin-bottom:4px')}${use(g.id, '0 0 16 16', '--fk:#7fd06a', 'width:64px;height:64px')}${g.id}</figure>`).join('') +
    gs('mini').map(g => `<figure class=d>${use(g.id, '0 0 40 16', '', 'width:40px;height:16px;margin-bottom:4px')}${use(g.id, '0 0 40 16', '', 'width:160px;height:64px')}${g.id}</figure>`).join('');
});
</script>
