# #264: core (state, gates, commands) <- server (the phone page) <- cli (the `herdsman` binary); docs/architecture.md.
[workspace]
members = ["crates/core", "crates/server", "crates/cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
aes-gcm = "0.11.1"
anyhow = "1"
base64 = "0.23.1"
clap = { version = "4", features = ["derive"] }
hkdf = "0.13.0"
p256 = { version = "0.14.0", default-features = false, features = ["ecdh", "ecdsa", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
toml = "0.8"
herdsman-core = { path = "crates/core" }
herdsman-server = { path = "crates/server" }
