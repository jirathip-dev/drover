flow = "issue"
states = ["design"]
reads = ["lane", "host", "ask"]
ignores = ["pr", "verdict", "turn"]

[[row]]
id = "ask-open"
when = { lane = "*", host = "*", ask = ["open"] }
do = "wait"
then = ["remind"]
owner = "owner"
timeout = "ask_waiting_minutes"
escalate = "owner"
say = "waiting on the owner's answer"

[[row]]
id = "decided"
when = { lane = "*", host = "*", ask = ["answered"] }
do = "deliver"
owner = "drive"
timeout = "act_minutes"
say = "apply the answer"

[[row]]
id = "host-offline"
when = { lane = "*", host = ["offline"], ask = ["none"] }
do = "wait"
then = ["move"]
owner = "drive"
timeout = "host_offline_minutes"
since = "host-heard"
say = "the lane's host is offline"

[[row]]
id = "no-lane"
when = { lane = ["none"], host = ["up", "loaded", "draining"], ask = ["none"] }
do = "reconcile"
owner = "drive"
timeout = "act_minutes"
escalate = "orchestrator"
say = "no design lane: reconcile"

[[row]]
id = "working"
when = { lane = ["running"], host = ["up", "draining"], ask = ["none"] }
do = "wait"
then = ["nudge", "respawn"]
owner = "lane"
timeout = "silent_minutes"
since = "heard"
say = "the lane is working"

[[row]]
id = "working-loaded"
when = { lane = ["running"], host = ["loaded"], ask = ["none"] }
do = "wait"
then = ["move"]
owner = "lane"
timeout = "host_wait_minutes"
since = "heard"
say = "the lane is working on a loaded host"

[[row]]
id = "limited"
when = { lane = ["limited"], host = ["up", "loaded", "draining"], ask = ["none"] }
do = "continue-at-reset"
then = ["respawn"]
owner = "drive"
timeout = "stall_minutes"
since = "reset"
say = "rate-limited: continue at the reset"

[[row]]
id = "ended"
when = { lane = ["done", "asleep"], host = ["up", "loaded", "draining"], ask = ["none"] }
do = "hand-off"
then = ["nudge", "respawn"]
owner = "drive"
timeout = "act_minutes"
to = ["design-review"]
say = "the design lane ended: hand off for review"

[[row]]
id = "lost"
when = { lane = ["exited", "gone"], host = ["up", "loaded", "draining"], ask = ["none"] }
do = "respawn"
owner = "drive"
timeout = "act_minutes"
say = "the design lane is gone: respawn it"
