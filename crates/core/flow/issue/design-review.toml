flow = "issue"
states = ["design-review"]
reads = ["ask"]
ignores = ["lane", "host", "pr", "verdict", "turn"]

[[row]]
id = "ask-open"
when = { ask = ["open"] }
do = "wait"
then = ["remind"]
owner = "owner"
timeout = "ask_waiting_minutes"
escalate = "owner"
say = "waiting on the owner's answer"

[[row]]
id = "decided"
when = { ask = ["answered"] }
do = "apply-decision"
owner = "drive"
timeout = "act_minutes"
to = ["queued", "design", "needs-human"]
say = "apply the answer"

[[row]]
id = "no-ask"
when = { ask = ["none"] }
do = "hand-off"
owner = "drive"
timeout = "act_minutes"
say = "no review ask: raise it"
