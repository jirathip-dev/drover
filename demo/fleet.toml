# Synthetic demo fleet for `drover serve --export site --demo` (#39). Nothing here is real.
models = ["opus", "sonnet"]

[limits]
stall_minutes = 240

[fleet.acme-web]
repo = "acme-example/acme-web"
local = "/srv/acme/acme-web"
integration = "staging"

[fleet.acme-web.role.impl]
harness = "claude"
model = "opus"
effort = "xhigh"

[fleet.acme-web.role.rev]
harness = "hermes"
profile = "fleet-rev"

[fleet.acme-api]
repo = "acme-example/acme-api"
local = "/srv/acme/acme-api"
integration = "staging"

[fleet.acme-api.role.impl]
harness = "dsh"

[fleet.acme-api.role.rev]
harness = "claude"
model = "opus"

# #386: the orchestrator that talks the [chat] tab's acme-api and all-repos threads through.
[fleet.acme-api.role.orchestrator]
harness = "claude"
model = "opus"

[fleet.docs]
repo = "acme-example/docs"
local = "/srv/acme/docs"
integration = "staging"

[fleet.docs.role.impl]
harness = "claude"
model = "sonnet"
effort = "high"

# #173: acme-api runs a custom pipeline: a second check (sec) between rev and the gate.
[fleet.acme-api.role.sec]
harness = "claude"
model = "opus"

[[fleet.acme-api.pipeline.stage]]
name = "impl"
kind = "build"
role = "impl"
next = { push = "rev" }

[[fleet.acme-api.pipeline.stage]]
name = "rev"
kind = "check"
role = "rev"
rounds = 3
next = { PASS = "sec", FAIL = "impl" }

[[fleet.acme-api.pipeline.stage]]
name = "sec"
kind = "check"
role = "sec"
rounds = 2
next = { PASS = "gates", FAIL = "impl" }

[[fleet.acme-api.pipeline.stage]]
name = "gates"
kind = "gate"
rounds = 3
next = { ok = "merge", ci_red = "impl", conflict = "impl:update" }

[fleet.acme-ios]
repo = "acme-example/acme-ios"
local = "/srv/acme/acme-ios"
integration = "staging"
paused = true

[fleet.acme-ios.role.impl]
harness = "claude"
model = "opus"
