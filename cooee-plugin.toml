name = "drover"
version = "0.1.0"
build = "true"
run = "exec drover serve --addr 127.0.0.1:$PORT"
needs = ["drover"]
attach = "http://127.0.0.1:7777"
attach_token = "~/.config/drover/cooee-token"

[[places]]
type = "header-strip"
id = "queue"
persona = "conductor"
label = "Queue"
screen = "/screens/queue"

[[places]]
type = "header-strip"
id = "events"
persona = "conductor"
label = "Events"
screen = "/screens/events"

[[places]]
type = "header-strip"
id = "lanes"
persona = "conductor"
label = "Lanes"
screen = "/screens/lanes"

[[places]]
type = "chat-cards"
persona = "conductor"

[[places]]
type = "menu-row"
label = "drover"
subtitle = "drover's fleets"
screen = "/screens/fleets"

[permissions]
places = ["header-strip", "chat-cards", "menu-row"]
push = true
actions = ["filter", "drive", "pause", "drive-all", "force", "later", "top", "limit", "answer", "unpark", "run-card", "needs-human", "save-fleets", "stop", "drop", "remove-fleet", "kill", "clean", "close", "send", "move", "queue", "config-card", "secret-card", "host", "reap", "orphans", "new-issue", "scope-drop"]
destructive = ["stop", "drop", "remove-fleet", "run-card", "needs-human", "kill", "clean", "close", "config-card", "host", "reap", "orphans", "scope-drop"]
network = ["api.github.com", "127.0.0.1:7777"]

[threads]
profiles = "/cooee/profiles"
started = "/cooee/thread-started"
attach = "/api/v1/orchestrator-attach"
detach = "/api/v1/orchestrator-detach"
rows = "/api/v1/rows"
stream = "/api/v1/rows/stream"
thread = "/api/v1/thread/<id>/rows"
said = "/api/v1/thread/<id>/said"
