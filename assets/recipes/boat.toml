# #254: the built-in `boat` cloud recipe (boat.dev, docs.boat.dev). A file `<config>/recipes/boat.toml` replaces it.
# Each command is a `sh -c` template: `{name}` is the `[hosts.<name>]` key (the sandbox name), `{size}` its `size`.
# The provider key (`key_env`) is exported from stdin, never in argv or the event log.
# `status` prints `running` when up; `address` prints `user@host port`, then the host key (`ssh-ed25519 AAAA…`).
key_env = "BOAT_API_KEY"
create = "boat create {name} --size {size}"
start = "boat resume {name}"
stop = "boat stop {name}"
status = "boat status {name} --format '{{.State}}'"
address = "boat ssh-info {name}"
destroy = "boat destroy {name} --yes"
# #255: `hosts snapshot` saves a bootstrapped host; `create_from` makes a new one from that snapshot, ready to use.
snapshot = "boat snapshot create {name} --name herdsman-{name}"
create_from = "boat create {name} --size {size} --from herdsman-{name}"

# #537: `[ci_runners]` VMs (boat.dev's HTTP API, docs.boat.dev; check them there). `{vm}` is a VM id; `{size}`,
# `{ttl}` (seconds, 0 = none) and `{snapshots}` come from `[ci_runners]`. `runner_create` prints the new VM's id,
# `runner_state` its state. The VM-side commands (`runner_revive`, `runner_token`, `runner_drain`, `runner_names`) run
# through `runner_exec` as `$C`; `{rt}` in them is the registration token, read from stdin (`$RT`), never in argv.
runner_create = """curl -sf -X POST -H "Authorization: Bearer $BOAT_API_KEY" -H 'Content-Type: application/json' \
https://boat.dev/api/v1/sandboxes -d '{"type":"{size}","ttlSeconds":{ttl},"snapshots":{snapshots}}' \
| python3 -c 'import json,sys;print(json.load(sys.stdin)["sandbox"]["id"])'"""
runner_state = """curl -sf -H "Authorization: Bearer $BOAT_API_KEY" https://boat.dev/api/v1/sandboxes/{vm} \
| python3 -c 'import json,sys;d=json.load(sys.stdin);print(d.get("sandbox",d).get("state"))'"""
runner_delete = """curl -sf -X DELETE -H "Authorization: Bearer $BOAT_API_KEY" -H "X-Ascii-Confirm-Delete: {vm}" \
https://boat.dev/api/v1/sandboxes/{vm} -o /dev/null"""
runner_exec = """python3 -c 'import json,os;print(json.dumps({"command":os.environ["C"].replace("{rt}",os.environ.get("RT","")),"timeoutSeconds":600}))' \
| curl -sf -X POST -H "Authorization: Bearer $BOAT_API_KEY" -H 'Content-Type: application/json' \
https://boat.dev/api/v1/sandboxes/{vm}/commands --data @- | python3 -c 'import json,sys;print(json.load(sys.stdin).get("stdout",""))'"""
runner_revive = "echo {rt} | sudo tee /run/rt >/dev/null && sudo chmod 600 /run/rt && sudo systemctl restart synergy-ci"
runner_token = "echo {rt} | sudo tee /run/rt >/dev/null && sudo chmod 600 /run/rt"
runner_drain = "sudo touch /run/stop-runners"
runner_names = "echo boat-$(cut -c1-6 /etc/machine-id)-"

# USD per running hour by size; check docs.boat.dev pricing and override in your own recipe file.
[rate_usd_hour]
small = 0.05
medium = 0.10
large = 0.20
xlarge = 0.40
