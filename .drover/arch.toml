[[ban]]
pattern = "agent_status"
paths = ["crates/*/src/**"]
reason = "#1053: a lane's status is session::Status, mapped from shed once in crates/core/src/session/"

[[ban]]
pattern = "Command::new"
paths = ["crates/*/src/**"]
except = ["crates/core/src/runner.rs"]
reason = "#809: processes start only in core's runner (crate::runner)"

[[ban]]
pattern = "std::process"
paths = ["crates/*/src/**"]
except = ["crates/core/src/runner.rs"]
reason = "#809: processes start only in core's runner (crate::runner, runner::pid, runner::exit)"

[[ban]]
pattern = "thread::sleep"
paths = ["crates/*/src/**"]
except = ["crates/core/src/clock.rs"]
reason = "#809: time is read and waited on only in core's clock (crate::clock::sleep)"

[[ban]]
pattern = "env::var"
paths = ["crates/*/src/**"]
except = ["crates/core/src/config.rs"]
reason = "#809: the environment is read only in core's config (crate::config::env)"

[[ban]]
pattern = "SystemTime::now"
paths = ["crates/*/src/**"]
except = ["crates/core/src/clock.rs"]
reason = "#809: time is read and waited on only in core's clock (crate::clock)"

[[ban]]
pattern = "Instant::now"
paths = ["crates/*/src/**"]
except = ["crates/core/src/clock.rs"]
reason = "#809: time is read and waited on only in core's clock (crate::clock::instant)"

[[ban]]
pattern = "pane_id"
paths = ["crates/*/src/**"]
reason = "#1053: a session is addressed by its shed name; no herdr-shaped row"

[[ban]]
pattern = ".reported"
paths = ["crates/*/src/**"]
except = ["crates/core/src/session/**"]
reason = "#1053: shed's reported state is read in crates/core/src/session/ only (Status::of)"

[[ban]]
pattern = "read_argv"
paths = ["crates/*/src/**"]
except = ["crates/core/src/term.rs", "crates/core/src/setup.rs", "crates/core/src/providers/**"]
reason = "#1053: no lane fact is read off a screen; a transcript is session::transcript"
