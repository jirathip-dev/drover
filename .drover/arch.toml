frozen = ["ci/cap.toml"]
generated = ["assets/types/api.d.ts"]
generate = "just types"

[[collect]]
dir = "ci/cap.d"
glob = "*.toml"

[comments]
policy = "off"
except = ["assets/types/**", "web/dist/**"]

[docs]
paths = ["docs/**/*.md", "README.md"]
watch = ["crates/core/src/cli.rs", "crates/core/src/config.rs", "crates/server/src/api.rs"]
cli = true
skip = [".drover/**"]

[[ban]]
pattern = "claude"
paths = ["crates/*/src/**", "web/src/**"]
except = ["crates/core/src/providers/**", "web/src/system.ts", "web/src/host.ts"]
reason = "#806: core never names a provider; its code goes in crates/core/src/providers/ (docs/providers.md); #830: nor does web/src (system.ts and host.ts until the frozen board, #552, retires)"
comments = true
ignore_case = true

