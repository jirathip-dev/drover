[comments]
policy = "strict"
except = [
    "assets/types/**",
    "web/dist/**",
    "web/src/**",
    "web/lint-fixtures/**",
    "crates/server/src/serve.rs",
    "crates/server/src/serve/chat.rs",
    "crates/server/src/serve/fresh.rs",
    "crates/server/src/serve/slo.rs",
]

[docs]
paths = ["docs/**/*.md", "README.md"]
watch = ["crates/core/src/cli.rs", "crates/core/src/config.rs", "crates/server/src/api.rs"]
cli = true
skip = [".drover/**"]

[[ban]]
pattern = "claude"
paths = ["crates/*/src/**", "web/src/**"]
except = ["crates/core/src/providers/**"]
reason = "#806: core never names a provider; its code goes in crates/core/src/providers/ (docs/providers.md); #830: nor does web/src"
comments = true
ignore_case = true

