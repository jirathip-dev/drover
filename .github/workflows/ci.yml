name: ci
on:
  push:
    branches: [main, staging]
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  gates:
    uses: jirathip-dev/gatekeeper/.github/workflows/gates.yml@098ea5f140cbb27c9837bb559a91f733cb76189e # v1.6.0
    secrets:
      private-names: ${{ secrets.PRIVATE_NAMES }}
