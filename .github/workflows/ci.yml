name: ci
on:
  push:
    branches: [main, staging]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # #266: the tests run web/src/events.ts under node (type stripping: node 24).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: build
        run: cargo build --release --locked
      - name: fmt
        run: cargo fmt --check
      - name: "clippy (#808: pedantic on every crate, at most 10 #[allow] in crates/; #809: banned APIs in non-test code)"
        run: |
          cargo clippy --workspace --lib --bins --locked -- -D warnings
          cargo clippy --workspace --tests --locked -- -D warnings -A clippy::unwrap_used -A clippy::expect_used -A clippy::panic -A clippy::indexing_slicing -A clippy::as_conversions -A clippy::print_stdout -A clippy::print_stderr -A clippy::let_underscore_must_use
          n=$(grep -rE '#!?\[allow\(' crates | wc -l)
          test "$n" -le 10 || { echo "::error::$n #[allow] attributes in crates/, at most 10"; exit 1; }
      - name: "banned-API fixtures (#809: each ci/lint-fixtures/rust/<lint>.rs fails clippy under the workspace [lints])"
        run: scripts/lint-fixtures.sh rust
      - name: "test shards (#1162: every test target is in exactly one shard of scripts/test-shards.txt)"
        run: scripts/test-shards.sh check
      - name: "perf in release (#447: waits and the Lanes tab on a 30,000-event log; #560: the board's CPU per 100 requests; #859: /api/v1/state on 150,000 events; #954: a drive pass over 30,000 events and 150 done issues; #962: stats autonomy on 150,000 events; #1313: the screens on a live-shaped gh cache)"
        run: cargo test --release --locked --test perf -- waits_and_the_lanes_tab_stay_fast_on_a_30k_event_log a_hundred_board_requests the_state_read_stays_under_300ms a_pass_over_30k_events_and_150_done_issues_stays_fast stats_autonomy_on_a_150k screens_on_a_live_shaped_fixture --nocapture --test-threads=1
      - name: "soak (#895: serve's RSS under 8 /live streams, reads and drive passes stays under 300 MB and stops growing; a planted leak fails it; #1162: on a push to staging only)"
        if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
        run: cargo test --release --locked --test soak -- --ignored --nocapture --test-threads=1
      - name: demo export (#39, synthetic data in demo/)
        run: DROVER_HOME=demo FLEET_CONFIG=demo/fleet.toml FLEET_STATE=demo/events.jsonl ./target/release/drover serve --export site --demo
      - name: leak gate (no ts.net hostname, chat ID or /Users/ path in docs/, demo/ or the exported demo)
        run: "! grep -rnE '[A-Za-z0-9-]\\.ts\\.net|telegram:-?[0-9]|/Users/' docs/ demo/ site/"
      - name: deps gate (direct deps ⊆ the allow-list in docs/serve.md)
        run: |
          extra=$(for f in Cargo.toml crates/*/Cargo.toml; do sed -n '/^\[\(workspace\.\)\{0,1\}dependencies\]/,/^\[/p' "$f"; done | grep -oE '^[a-z0-9_-]+' | grep -vxE 'clap|flate2|serde|serde_json|toml|anyhow|thiserror|p256|aes-gcm|hkdf|sha2|base64|ts-rs|shed-proto|blocks|swag|rusqlite|keyring|tokio|ratatui|drover-sys|drover-core|drover-server|drover-service|drover-chat' || true)
          test -z "$extra" || { echo "not allowed: $extra"; exit 1; }
      - name: layers (#264; core never depends on server or cli, server never on cli; #713 only the runner in core spawns processes, tests/runner_limits.rs checks every crate)
        run: |
          core=$(cargo tree --locked -p drover-core -e normal,build --prefix none)
          server=$(cargo tree --locked -p drover-server -e normal,build --prefix none)
          if grep -E '^drover(-server)? v' <<<"$core" || grep -E '^drover v' <<<"$server"; then exit 1; fi
          bad=$(grep -rlwE 'Command|Stdio|Child' crates/core/src | grep -vxE 'crates/core/src/runner\.rs' || true)
          test -z "$bad" || { echo "std::process outside the Runner implementations: $bad"; exit 1; }
      - name: "release has no ts-rs (#375: the TS bindings' dep is behind the `ts` feature)"
        run: "! cargo tree --locked -p drover -e normal --prefix none | grep -E '^ts-rs(-macros)? v'"
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-deny
      - name: "deny (#808: licences, advisories, duplicate versions, sources; deny.toml)"
        run: cargo deny --locked check
      - name: "TS types (#375): serde's JSON type-checks with tsc, no hand-written copies (#973: arch-check's `generated` catches drift)"
        run: |
          npm install -g typescript@7.0.2
          cargo test --locked -p drover-server --features ts serde_json_fits_the_types
          just types-lint
      - name: "no Rust HTML (#269): crates/server builds the page shell only; the TypeScript board draws every tab"
        run: just html-lint
      - name: "timing check (#844): every core timing is a [limits] key; no hard-coded Duration in crates/core/src"
        run: scripts/timing-check.sh
      - name: "parity (#1094): each docs/parity.md row's test exists; a parity test or row deleted needs `dropped q<N>`"
        run: scripts/parity-check.sh HEAD^1
      - name: "line cap (formatted non-test Rust lines under src/ and crates/*/src/ at most line_cap in ci/cap.toml; a PR's cap edit carries a `Cap:` trailer)"
        run: ./target/release/drover cap-check --config ci/cap.toml ${BASE:+--base "$BASE"}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
      - name: "arch-check (#734: layers, banned calls and size baselines in .drover/arch.toml; #735: new comments, stale docs)"
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            printf '%s' "$BODY" > "$RUNNER_TEMP/pr-body.md"
            set -- --base HEAD^1 --pr-body "$RUNNER_TEMP/pr-body.md"
          fi
          ./target/release/drover arch-check "$@"
      - name: "lesson checks (#510: shadow ones report would-fail in the job summary and never fail; active ones fail)"
        run: ./target/release/drover lesson-check
      - name: assets budget (warn only; ≤ 1500 lines of JS/CSS under assets/)
        run: |
          n=$(cat assets/*.js assets/*.css | wc -l)
          echo "assets JS/CSS lines: $n"
          test "$n" -le 1500 || echo "::warning::assets JS/CSS is $n lines, over the 1500 soft budget"

  # #957: the debug suite beside the rust job's release half; #1162: in 4 shards side by side (scripts/test-shards.txt).
  test-shard:
    name: test (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      # #266: the tests run web/src/events.ts under node (type stripping: node 24).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: "test (#337: tests/perf.rs is the hard perf gate; its numbers go to the job summary; #957: nextest runs the test binaries side by side)"
        run: |
          flags=$(scripts/test-shards.sh ${{ matrix.shard }})
          read -ra targets <<<"$flags"
          cargo nextest run --locked --no-fail-fast --workspace "${targets[@]}"
      - name: "no test temp dirs left (#535: each test removes its fleet-test-* dirs, pass or fail)"
        run: |
          left=$(find "${TMPDIR:-/tmp}" -maxdepth 1 -name 'fleet-test-*')
          test -z "$left" || { echo "::error::test temp dirs left behind:"; echo "$left"; exit 1; }

  # #1162: the one `test` check that branch protection and required_checks name, green only when every shard is.
  test:
    needs: test-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test-shard.result }}" = success

  # #808: a workflow file GitHub can't parse fails here, on the PR.
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint (.github/workflows/**)
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

  # #265: the TypeScript board (web/): strict typecheck and the esbuild bundle; #1147: arch-check's `just gen` diffs dist.
  # Node is CI's and developers' only: the binary embeds the committed web/dist, so `cargo install` needs no Node.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: install (pinned typescript + esbuild, package-lock.json)
        run: npm ci --no-audit --no-fund
      - name: typecheck (tsc --strict --noEmit)
        run: npm run check
      - name: "banned TypeScript (#809: lint.mjs on src, and each lint-fixtures/<name>.ts fails it)"
        run: |
          npm run lint
          ../scripts/lint-fixtures.sh ts
      - name: "build (#1147: arch-check's `just gen` holds the committed dist to it)"
        run: npm run build
      - name: web TypeScript lines (soft budget, reported only; #265 Q5)
        run: |
          echo "web/src TypeScript lines: $(cat src/*.ts | wc -l)" | tee -a "$GITHUB_STEP_SUMMARY"

  # #63 gate 2 (docs/ui.md): headless Chrome (preinstalled on ubuntu-latest) audits the demo at 390 px.
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # #71: backstop; ui-audit.sh kills a hung Chrome run after 60 s
    outputs:
      flaky: ${{ steps.hangs.outputs.flaky }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: build (debug, the profile its tests build; the release build is the rust job's only)
        run: cargo build --locked
      - name: demo export
        run: DROVER_HOME=demo FLEET_CONFIG=demo/fleet.toml FLEET_STATE=demo/events.jsonl ./target/debug/drover serve --export site --demo
      # #68: Chrome's new headless never makes a window under 500 px wide; the headless shell honours 390.
      # Pinned build (Google's Chrome-for-Testing), so layout never moves without a commit.
      - name: chrome-headless-shell
        run: |
          c=$(npx -y @puppeteer/browsers@2.6.1 install chrome-headless-shell@156.0.8078.80 --path "$RUNNER_TEMP/chs" | tail -1 | cut -d' ' -f2-)
          test -x "$c" || { echo "::error::chrome-headless-shell install gave no binary: '$c'"; exit 1; }
          echo "CHROME=$c" >> "$GITHUB_ENV"
      - name: the lifeboat page for the audit (#725)
        run: LIFEBOAT_SITE="$PWD/site" cargo test --locked --test lifeboat the_page_for_the_ui_audit
      - name: ui audit at 390 px (and 1440, #337) of the screens the page draws (#927)
        run: scripts/ui-audit.sh site ui-390
      # #566: every hung Chrome run in the job summary; views still hung after 2 retries go to the soft `ui-flaky` check.
      - name: Chrome hangs
        id: hangs
        if: always()
        run: |
          if [ -s ui-390/hangs.txt ]; then { echo "### Chrome hangs (#566)"; sed 's/^/- /' ui-390/hangs.txt; } >> "$GITHUB_STEP_SUMMARY"; fi
          echo "flaky=$(cut -d' ' -f1 ui-390/flaky.txt 2>/dev/null | sort -u | xargs)" >> "$GITHUB_OUTPUT"
      - name: "the page in Chrome on the real server (#927: answer, run cards, pause/resume, stop, Fleets, offline)"
        run: cargo test --locked --test page
      - name: the verify lane's browser evidence in Chrome (#731; console error, 500, known noise, design diff)
        run: cargo test --locked --test verify_browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-390
          path: ui-390/*.png
          retention-days: 14

  # #566: the soft check: views whose Chrome run hung 3 times. A warning, never red: the hang is no assertion failure.
  ui-flaky:
    needs: ui
    if: always() && needs.ui.outputs.flaky != ''
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::warning::headless Chrome hung 3 times on: $FLAKY (not this PR's failure; see the ui job summary)"
          echo "Chrome hung 3 times on: $FLAKY" >> "$GITHUB_STEP_SUMMARY"
        env:
          FLAKY: ${{ needs.ui.outputs.flaky }}

  # #862: ui-webkit runs only when the diff touches the page (#927: web/, assets/; #1312: crates/server/) or its own tests.
  changes:
    runs-on: ubuntu-latest
    outputs:
      webkit: ${{ steps.diff.outputs.webkit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "${BASE//0/}" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "webkit=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git diff --name-only "$BASE...$HEAD" | tee changed.txt
          webkit=false
          grep -qE '^(web/|assets/|crates/server/|crates/cli/tests/(support/webview\.mjs|perf\.rs|url_links\.rs|parity_webkit\.rs|page_drafts\.rs|keyboard_webkit\.rs|ui/(drafts|repaint|compose|timings|keyboard|answered|optimistic|pages)\.mjs|threads_tab\.rs|herd\.rs|issue_sheet_webkit\.rs|phone_timings\.rs|screen_pages\.rs|common/large\.rs))' changed.txt && webkit=true
          echo "webkit=$webkit" | tee -a "$GITHUB_OUTPUT"

  # #337: the page's first paint in WebKit (iOS Safari's engine), Playwright's WebKit on Linux.
  ui-webkit:
    needs: changes
    if: needs.changes.outputs.webkit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Pinned, so the engine never moves without a commit; CI-only (no package.json): the tests find it by NODE_PATH.
      - name: playwright webkit
        run: |
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" playwright@1.63.0
          npx --prefix "$RUNNER_TEMP/pw" playwright install --with-deps webkit
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node -e "require('playwright')"
      - name: first paint in WebKit (#337, hard gate < 300 ms warm; the numbers go to the job summary)
        run: cargo test --locked --test perf the_first_paint_in_webkit_is_under_300ms -- --nocapture
      - name: "phone timings on the large board (#1312, hard gate: tab, lane sheet, thread open, send and answer each a median <= 150 ms)"
        run: cargo test --locked --test phone_timings -- --nocapture
      - name: "Events in pages of 100 (#1316, hard gate: scrolling to the end appends in place; Events first paint p95 <= 150 ms)"
        run: cargo test --locked --test screen_pages webkit -- --nocapture
      - name: a thread tap and a thread push open the thread; back returns (#1088)
        run: cargo test --locked --test cooee_screens parity_46 -- --nocapture
      - name: "parity rows in WebKit (#1094: R25 sheet close, R5 loader strip)"
        run: cargo test --locked --test parity_webkit -- --nocapture
      - name: "parity rows red until their fix (#1094: each #[ignore] names its issue; soft)"
        continue-on-error: true
        run: cargo test --locked --test parity_webkit -- --ignored --nocapture
      - name: "url taps are real links in WebKit (#1085: no window.open, no white page in the Home Screen app)"
        run: cargo test --locked --test url_links
      - name: "typed text, focus, caret and scroll survive repaints; per-thread drafts (#1084, #65); a send shows at once and once, an answered card goes at once (#1315)"
        run: cargo test --locked --test page_drafts
      - name: "the focused composer keeps its node, focus, text and caret while the stream changes it (#1310)"
        if: ${{ !cancelled() }}
        run: cargo test --locked --test keyboard_webkit
      - name: the thread view in WebKit (#1086, #1087: opens at the end, older above in place, image viewer, keyboard; attachments, a failed send, queue and steer)
        if: ${{ !cancelled() }}
        run: cargo test --locked --test threads_tab webkit -- --test-threads=1
      - name: a Queue row opens its issue sheet, [lane] the transcript, back the sheet (#1090)
        run: cargo test --locked --test issue_sheet_webkit
      - name: "the Herd in WebKit (#1092: a figure per lane, night, the next repo, the pinned swag scene)"
        run: cargo test --locked --test herd
