[graph]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "aarch64-apple-darwin"]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.9

[licenses.private]
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
skip = [{ crate = "syn@2.0.119", reason = "ts-rs-macros, and ratatui's strum and crossterm's derive_more macros (build time only); clap and serde use syn 3" }]
skip-tree = [{ crate = "web-push-native@0.5.0", reason = "#1473: its p256 0.13, ece-native and jwt-simple (with superboring) pin the previous RustCrypto generation beside ours" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/jirathip-dev/shed",
    "https://github.com/jirathip-dev/blocks",
    "https://github.com/jirathip-dev/swag",
]
