[graph]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "aarch64-apple-darwin"]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "BSD-3-Clause", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.9

[licenses.private]
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
skip = [{ crate = "syn@2.0.119", reason = "ts-rs-macros only (the `ts` feature, never in the release build); clap and serde use syn 3" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/jirathip-dev/shed"]
