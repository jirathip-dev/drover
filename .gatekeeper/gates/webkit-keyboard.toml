about = "the focused composer keeps its node, focus, text and caret while the stream changes it (#1310)"
fix = "fix the page or the flow the test names; a timing budget is raised only in its own issue"
budget_secs = 600
leg = "ui-webkit"
setup = ["rust", "node"]
paths = ["web/**", "assets/**", "crates/server/**", "crates/cli/tests/support/webview.mjs", "scripts/webkit.sh", "crates/cli/tests/keyboard_webkit.rs", "crates/cli/tests/ui/keyboard.mjs"]
run = "scripts/webkit.sh cargo test --locked --test keyboard_webkit"
