about = "perf in release (#560: the board's CPU per 100 requests); the numbers go to the job summary"
fix = "make the case fit its budget; a budget is raised only in its own issue"
budget_secs = 900
leg = "release"
setup = ["rust", "node"]
paths = ["crates/**", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "assets/**", "demo/**", "web/dist/**"]
run = '''
if [ -z "${CI:-}" ]; then echo "CI's release leg runs it"; exit 0; fi
cargo test --release --locked --test perf -- a_hundred_board_requests --nocapture --test-threads=1
'''
