about = "Events in pages of 100 (#1316, hard gate: scrolling to the end appends in place; Events first paint p95 <= 150 ms)"
fix = "fix the page or the flow the test names; a timing budget is raised only in its own issue"
budget_secs = 600
leg = "ui-webkit"
setup = ["rust", "node"]
paths = ["web/**", "assets/**", "crates/server/**", "crates/cli/tests/support/webview.mjs", "scripts/webkit.sh", "crates/cli/tests/screen_pages.rs", "crates/cli/tests/ui/pages.mjs", "crates/cli/tests/common/large.rs"]
run = "scripts/webkit.sh cargo test --locked --test screen_pages webkit -- --nocapture"
