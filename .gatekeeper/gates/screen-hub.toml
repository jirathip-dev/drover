about = "screen hub in release (#1372: one build per change for every reader, fresh data under 150 ms p95, 30 streams with no 503, ETag and 304)"
fix = "make the case fit its budget; a budget is raised only in its own issue"
budget_secs = 600
leg = "release-hub"
setup = ["rust", "node"]
needs = ["quiet-host"]
paths = ["crates/**", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "assets/**", "demo/**", "web/dist/**"]
run = '''
cargo test --release --locked --test screen_hub -- --nocapture --test-threads=1
'''
