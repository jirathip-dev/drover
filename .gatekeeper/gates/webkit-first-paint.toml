about = "the page's first paint in WebKit (#337, hard gate < 300 ms warm; the numbers go to the job summary)"
fix = "fix the page or the flow the test names; a timing budget is raised only in its own issue"
budget_secs = 600
leg = "ui-webkit"
setup = ["rust", "node"]
paths = ["web/**", "assets/**", "crates/server/**", "crates/cli/tests/support/webview.mjs", "scripts/webkit.sh", "crates/cli/tests/perf.rs", "crates/cli/tests/perf/**"]
run = "scripts/webkit.sh cargo test --locked --test perf the_first_paint_in_webkit_is_under_300ms -- --nocapture"
