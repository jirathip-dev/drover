about = "typed text, focus, caret and scroll survive repaints; per-thread drafts (#1084, #65); a send shows at once and once, an answered card goes at once (#1315); an older page reloads for a new build (#1351)"
fix = "fix the page or the flow the test names; a timing budget is raised only in its own issue"
budget_secs = 600
leg = "ui-webkit"
setup = ["rust", "node"]
paths = ["web/**", "assets/**", "crates/server/**", "crates/cli/tests/support/webview.mjs", "scripts/webkit.sh", "crates/cli/tests/page_drafts.rs", "crates/cli/tests/ui/build.mjs", "crates/cli/tests/ui/drafts.mjs", "crates/cli/tests/ui/repaint.mjs", "crates/cli/tests/ui/compose.mjs", "crates/cli/tests/ui/answered.mjs", "crates/cli/tests/ui/optimistic.mjs", "crates/cli/tests/ui/settled.mjs", "crates/cli/tests/ui/revive.mjs"]
run = "scripts/webkit.sh cargo test --locked --test page_drafts"
