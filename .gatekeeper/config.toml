packs = ["core", "rust", "ts"]
integration = "staging"

[cache]

[docs]
watch = ["crates/core/src/cli.rs", "crates/core/src/config.rs", "crates/core/src/config/limit_docs.rs", "crates/server/src/api.rs"]
skip = [".drover/**", "roles/usage-tail.md", "scripts/test-shards.txt"]

[ts]
projects = ["web"]
install = "npm --prefix web ci --no-audit --no-fund"

[budgets]
"core/arch" = 600

[legs.release]
platform = "linux"

[legs.release-hub]
platform = "linux"

[legs.test]
platform = "linux"

[legs.ui]
platform = "linux"

[legs.ui-webkit]
platform = "linux"

[pin]
version = "1.5.0"
aarch64-apple-darwin = "8feed2b1fb09133a0a1bf6e3497d0dc5ca0645e7c260276d2cd1392391ad08bd"
